[chesssets]
; example: 2 N A ->2D, Non-Palette, Class A (like classes interchange on re-size)
; 2d/3d field can be I, means interchangeable
; palette field can be I, also means interchangeable
; first two numbers are x and y offset of piece in template bitmap
; last number is which hand to use with this chess set
;
;
2_2dS=Symbols I I S 15 15 0
