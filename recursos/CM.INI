[playfield]
separate_controls=0
touch_pieces_ok=1
;
; type: human 0, computer 1, remote 2
; color: white 0, black 1
; moves/minutes: response-type 0
; secs/move: response-type 1
; min/game: response-type 2
; infinite: response-type 3
; equal-time: response-type 4
; fixed-depth: response-type 5
;
top_blindfold=0
top_human=Human
top_computer=Chessmaster
;
; type color response-type moves/minutes minutes seconds minutes/game depth
top_data=1 0 1 40 40 10 30 6
;
bottom_blindfold=0
bottom_human=Human
bottom_computer=Chessmaster
;
; type color response-type moves/minutes minutes seconds minutes/game depth
bottom_data=0 1 1 40 40 20 30 6
;

